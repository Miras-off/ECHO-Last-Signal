name: Bug report
description: Report a reproducible problem in ECHO
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the game version and observed behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Launch ...\n2. Open ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: Expected vs actual result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots (remove private data)
